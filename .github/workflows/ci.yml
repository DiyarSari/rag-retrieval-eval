name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Unit tests don't touch the embedding models, so skip torch / sentence-transformers.
      - run: pip install certifi numpy anthropic pytest ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
